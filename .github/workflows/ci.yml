name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests evals
      - run: uv run --frozen ruff format --check src tests evals
      - run: uv run --frozen mypy -p connected_models -p tests -p evals
      - run: uv run --frozen pytest -q
      - run: uv build
        if: matrix.python == '3.14'
