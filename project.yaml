name: Connected Models
slug: connected-models
purpose: 'Build an interconnected quantitative model graph and execution runtime that eliminates arbitrary assumptions and empowers AI agents with deterministic calculation, simulation, and decision modeling.'
project_memory:
  schema_version: 2
  protocol_version: 2
principles:
- This repository is one isolated project memory.
- Project-created knowledge is the primary asset.
- External sources are supporting evidence, not the center of the system.
- Agents search project memory before external research.
- Capture freely, consolidate aggressively, preserve provenance.
retrieval:
  project_state_max_chars: 12000
  summary_max_chars: 800
  context_max_chars: 30000
  default_search_results: 8
  default_graph_depth: 1
